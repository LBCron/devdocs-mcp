[package]
name = "devdocs-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source adapters, normalization, and symbol extraction for devdocs"

[lib]
name = "devdocs_ingest"
path = "src/lib.rs"

[features]
default = []
exact-tokens = ["dep:tiktoken-rs", "text-splitter/tiktoken-rs"]

[dependencies]
bytes.workspace = true
comrak.workspace = true
ctrlc.workspace = true
devdocs-model.workspace = true
devdocs-store.workspace = true
ignore.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
text-splitter.workspace = true
tiktoken-rs = { workspace = true, optional = true }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
devdocs-testkit.workspace = true
insta.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
