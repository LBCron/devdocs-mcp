[package]
name = "devdocs-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite storage, schema, and migrations for devdocs"

[lib]
name = "devdocs_store"
path = "src/lib.rs"

[features]
default = []
embeddings = ["dep:fastembed"]

[dependencies]
devdocs-model.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
serde_json.workspace = true
sha2.workspace = true
blake3.workspace = true
time.workspace = true
tracing.workspace = true
fastembed = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
# rusqlite: the concurrent-open test matches the busy error by code.
rusqlite.workspace = true
tempfile.workspace = true
url.workspace = true
proptest.workspace = true
devdocs-testkit.workspace = true

[lints]
workspace = true
# fastembed rides the opt-in `embeddings` feature (default off) ahead of its
# call sites; feature-gated usage is invisible to the machete scan.
[package.metadata.cargo-machete]
ignored = ["fastembed"]
